[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwp-py"
version = "0.4.0"
description = "Python client for the GQL Wire Protocol (GWP)"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
keywords = ["gql", "graph", "grpc", "wire-protocol", "database"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "grpcio>=1.78.0",
    # Python 3.15 wheels exist from grpcio 1.84.0.
    "grpcio>=1.84.0; python_version >= '3.15'",
    "protobuf>=6.33.5",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.78.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
extend-exclude = ["src/gwp_py/_generated"]

[tool.hatch.build.targets.wheel]
packages = ["src/gwp_py"]
