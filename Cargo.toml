[package]
name = "gwp"
version = "0.4.0"
edition = "2024"
rust-version = "1.99.0"
description = "A standalone, pure Rust gRPC wire protocol for GQL (ISO/IEC 39075)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GrafeoDB/gql-wire-protocol"
readme = "README.md"
keywords = ["gql", "graph", "grpc", "wire-protocol", "database"]
categories = ["database", "network-programming"]

[features]
default = []
tls = ["tonic/tls-ring"]

[dependencies]
prost = "0.14.3"
thiserror = "2"
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-prost = "0.14.9"
tracing = "0.1.40"

[build-dependencies]
prost-build = "0.14.3"
tonic-prost-build = "0.14.9"

[dev-dependencies]
bytes = "1"
prost-types = "0.14.3"
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "test-util"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = true
